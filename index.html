<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>hello CC's world</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html {
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
    }
    body {
      font-size: 16px;
      overflow-wrap: break-word;
    }
    img, video, iframe, embed, object, svg, canvas {
      max-width: 100%;
    }
    img, video {
      height: auto;
    }
    #navToggle {
      display: none;
    }
    #topBox{
      color:red;
      display:flex;
      justify-content: center;
      align-items: center;
      background: url(./102303153.jpg);
      background-size: 100% 100%;
      height:20vh;
    }
    #slogan{
      color:green;
      font-size: 20px;
    }
    #center{
      height: 70vh;
      display: flex;
      justify-content: center;
    }
    #sideBar{
      width: 20%;
      height: 100%;
      background-color: purple;
    }

    #main{
      width: 80%;
      height: 100%;
      background-color: #fff;
    }
    #bottom{
      height: 10vh;
      background-color: goldenrod;
      background-image: url(./102303153.jpg);
      background-size: 100% 100%; 
      display: flex;
      align-items: center;
    }

    /* Phones and small tablets: desktop layout above is untouched */
    @media (max-width: 768px) {
      #topBox {
        flex-wrap: wrap;
        gap: 8px;
        height: auto;
        min-height: 20vh;
        padding: 16px;
        text-align: center;
      }
      #topBox p {
        font-size: 16px;
      }
      #center {
        flex-direction: column;
        height: auto;
        min-height: 70vh;
      }
      #sideBar,
      #main {
        width: 100%;
        height: auto;
      }
      #main {
        flex: 1;
        min-height: 50vh;
      }
      #navToggle {
        display: flex;
        align-items: center;
        gap: 8px;
        min-width: 44px;
        min-height: 44px;
        width: 100%;
        padding: 10px 16px;
        border: 0;
        background: transparent;
        color: #fff;
        font: inherit;
        font-size: 16px;
        cursor: pointer;
      }
      #navToggle .bars,
      #navToggle .bars::before,
      #navToggle .bars::after {
        display: block;
        width: 22px;
        height: 2px;
        background: currentColor;
        position: relative;
      }
      #navToggle .bars::before,
      #navToggle .bars::after {
        content: "";
        position: absolute;
        left: 0;
      }
      #navToggle .bars::before { top: -7px; }
      #navToggle .bars::after { top: 7px; }
      #navMenu {
        display: none;
        padding: 0 16px 8px;
      }
      #sideBar.open #navMenu {
        display: block;
      }
      #navMenu h2 {
        display: flex;
        align-items: center;
        min-height: 44px;
        font-size: 20px;
      }
      #bottom {
        height: auto;
        min-height: max(10vh, 44px);
        padding: 12px 16px;
      }
    }
  </style>
</head>
<body>
  <div id="topBox">
  <h1 id="slogan">hello CC's world</h1>
  <p>原神牛逼</p>
  </div>
  <div id="center">
    <nav id="sideBar">
      <button id="navToggle" type="button" aria-expanded="false" aria-controls="navMenu">
        <span class="bars" aria-hidden="true"></span>
        <span>菜单</span>
      </button>
      <div id="navMenu">
        <h2>导航栏</h2>
        <h2>yuanshen</h2>
      </div>
    </nav>
    <div id="main"></div>
  </div>
  <div id="bottom">
    底部栏
  </div>
  <script>
    (function () {
      var bar = document.getElementById('sideBar');
      var btn = document.getElementById('navToggle');
      btn.addEventListener('click', function () {
        var open = bar.classList.toggle('open');
        btn.setAttribute('aria-expanded', open ? 'true' : 'false');
      });
    })();
  </script>
  <!-- 没有 type="module"，经典脚本 -->
  <script type="module" src="./test.js"></script>
</body>
</html>
